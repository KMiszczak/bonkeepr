name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Generate the Android project structure.
      - name: Recreate Android Project
        run: flutter create . --org com.example --project-name garantieheld --android-language java

      # Required by flutter_local_notifications on Android.
      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          gradle_file = kotlin if kotlin.exists() else groovy
          if not gradle_file.exists():
              raise SystemExit("Android app Gradle build file was not generated")

          is_kotlin = gradle_file.suffix == ".kts"
          text = gradle_file.read_text()
          min_sdk_pattern = r"(?m)^(\s*)minSdk(?:Version)?\s*(?:=|\s)\s*.*$"
          min_sdk_value = "minSdk = 23"
          text, min_sdk_count = re.subn(min_sdk_pattern, lambda match: match.group(1) + min_sdk_value, text, count=1)
          if min_sdk_count == 0:
              raise SystemExit("Could not find minSdk setting in Android app Gradle file")

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              setting = "isCoreLibraryDesugaringEnabled = true" if is_kotlin else "coreLibraryDesugaringEnabled true"
              pattern = r"(?m)^(\s*)compileOptions\s*\{\s*$"
              text, count = re.subn(pattern, lambda match: f"{match.group(0)}\n{match.group(1)}    {setting}", text, count=1)
              if count != 1:
                  raise SystemExit("Could not find compileOptions block in Android app Gradle file")

          if "coreLibraryDesugaring(" not in text and "coreLibraryDesugaring \"" not in text:
              dependency = (
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
                  if is_kotlin else
                  'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"'
              )
              pattern = r"(?m)^(\s*)dependencies\s*\{\s*$"
              text, count = re.subn(pattern, lambda match: f"{match.group(0)}\n{match.group(1)}    {dependency}", text, count=1)
              if count == 0:
                  text = f"{text.rstrip()}\n\ndependencies {{\n    {dependency}\n}}\n"

          mlkit_artifacts = [
              "com.google.mlkit:text-recognition-chinese:16.0.1",
              "com.google.mlkit:text-recognition-devanagari:16.0.1",
              "com.google.mlkit:text-recognition-japanese:16.0.1",
              "com.google.mlkit:text-recognition-korean:16.0.1",
          ]
          for artifact in mlkit_artifacts:
              if artifact in text:
                  continue
              dependency = f'implementation("{artifact}")' if is_kotlin else f"implementation '{artifact}'"
              pattern = r"(?m)^(\s*)dependencies\s*\{\s*$"
              text, count = re.subn(
                  pattern,
                  lambda match: f"{match.group(0)}\n{match.group(1)}    {dependency}",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not add ML Kit OCR artifacts to Android app Gradle file")

          gradle_file.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          camera_permission = 'android.permission.CAMERA'
          if camera_permission not in manifest_text:
              manifest_text = re.sub(
                  r"(<manifest\b[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.CAMERA" />',
                  manifest_text,
                  count=1,
              )
              manifest.write_text(manifest_text)
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garantieheld-app
          path: build/app/outputs/flutter-apk/app-release.apk
