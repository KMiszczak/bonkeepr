name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Erstellt das Projektgerüst in der Cloud
      - name: Recreate Flutter Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.example garantieheld
          cp -r garantieheld/android ../
          cd ..
          rm -rf temp_app

      # Aktiviert Core Library Desugaring für flutter_local_notifications
      - name: Enable Core Library Desugaring
        run: |
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garantieheld-app
          path: build/app/outputs/flutter-apk/app-release.apk
