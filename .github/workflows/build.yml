name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Erstellt die Android-Struktur im Alt-Format (.gradle)
      - name: Recreate Android Project
        run: flutter create . --org com.example --project-name garantieheld --android-language java

      # Fügt Desugaring ein (funktioniert nun garantiert)
      - name: Enable Core Library Desugaring
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4" }' >> android/app/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garantieheld-app
          path: build/app/outputs/flutter-apk/app-release.apk
