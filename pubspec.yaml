name: garantieheld
description: "Privater Kassenbon- und Garantie-Safe für Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  csv: ^6.0.0
  file_picker: ^10.3.10
  flutter_local_notifications: ^17.0.0
  google_generative_ai: ^0.4.7
  google_fonts: ^6.1.0
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.19.0
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^12.0.3
  pdf: ^3.10.8
  printing: ^5.13.1
  sqflite: ^2.3.0
  timezone: ^0.9.2
  gal: ^2.3.3
  share_plus: ^12.0.1
  flutter_timezone: ^5.1.1
  open_filex: ^5.0.0
  archive: ^4.5.2
  shared_preferences: ^2.5.6
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  image: ^4.12.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/bonkeeprlogotransparent.png
    - assets/EmptyStatePic.png
    - assets/EmptyState8Bit.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/bonkeepricon.jpg
  adaptive_icon_background: '#0F172A'
  adaptive_icon_foreground: assets/bonkeeprlogotransparent.png
  min_sdk_android: 21

flutter_native_splash:
  color: '#0F172A'
  image: assets/bonkeeprlogotransparent.png
  android: true
  ios: false
  web: false
  android_12:
    color: '#0F172A'
    image: assets/bonkeeprlogotransparent.png
